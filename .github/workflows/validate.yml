name: Validate Application

on:
  push:
    paths:
      - "backend/request-ride/**"
      - "frontend-tests/**"
      - "infra/**"
      - "js/**"
      - "css/**"
      - "*.html"
      - ".github/workflows/validate.yml"

  pull_request:
    paths:
      - "backend/request-ride/**"
      - "frontend-tests/**"
      - "infra/**"
      - "js/**"
      - "css/**"
      - "*.html"
      - ".github/workflows/validate.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-1
  SAM_CLI_TELEMETRY: "0"

jobs:
  validate:
    name: Check application and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python for local web server
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check frontend JavaScript syntax
        run: |
          node --check js/config.js
          node --check js/cognito-auth.js
          node --check js/ride.js
          node --check js/esri-map.js
          node --check js/main.js

      - name: Install Lambda dependencies
        working-directory: backend/request-ride
        run: npm ci

      - name: Check Lambda JavaScript syntax
        working-directory: backend/request-ride
        run: npm run check

      - name: Run Lambda unit tests
        working-directory: backend/request-ride
        run: npm test

      - name: Install browser test dependencies
        working-directory: frontend-tests
        run: npm ci

      - name: Install Chromium
        working-directory: frontend-tests
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: frontend-tests
        run: npx playwright test --config=playwright.config.cjs --reporter=list

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v3

      - name: Validate infrastructure template
        run: sam validate --lint --template-file infra/template.yaml

      - name: Build Lambda deployment package
        run: sam build --template-file infra/template.yaml
