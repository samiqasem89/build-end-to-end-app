<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Request a Ride | AWS Serverless Security Lab</title>

    <meta
        name="description"
        content="Educational AWS serverless application security lab."
    >

    <link
        rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
        integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
        crossorigin="anonymous"
    >

    <link
        rel="stylesheet"
        href="https://js.arcgis.com/4.6/esri/css/main.css"
    >

    <link rel="stylesheet" href="css/ride.css">
    <link rel="stylesheet" href="css/message.css">
</head>

<body>
    <div class="info panel panel-default">
        <div class="panel-heading">
            <button
                id="request"
                class="btn btn-primary"
                type="button"
                disabled
            >
                Select a pickup location
            </button>

            <div class="dropdown pull-right">
                <button
                    id="accountLink"
                    class="btn dropdown-toggle"
                    type="button"
                    data-toggle="dropdown"
                    aria-haspopup="true"
                    aria-expanded="false"
                >
                    Account <span class="caret"></span>
                </button>

                <ul
                    class="dropdown-menu"
                    aria-labelledby="accountLink"
                >
                    <li>
                        <a id="signOut" href="signin.html">
                            Sign out
                        </a>
                    </li>

                    <li>
                        <a href="index.html">
                            Return home
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="panel-body">
            <p>
                Educational lab. Ride requests require a configured
                AWS backend. When the backend is not configured,
                requests are disabled.
            </p>

            <ol
                id="updates"
                role="status"
                aria-live="polite"
                aria-relevant="additions text"
            >
                <li>Checking application configuration…</li>
            </ol>
        </div>
    </div>

    <main id="main">
        <div
            id="map"
            role="region"
            aria-label="Pickup location map"
        ></div>
    </main>

    <noscript>
        <p>
            JavaScript is required to use this application.
            No ride request has been submitted.
        </p>
    </noscript>

    <script src="js/vendor/jquery-3.1.0.js"></script>
    <script src="js/vendor/bootstrap.min.js"></script>
    <script src="js/vendor/aws-cognito-sdk.min.js"></script>
    <script src="js/vendor/amazon-cognito-identity.min.js"></script>

    <script src="https://js.arcgis.com/4.6/"></script>

    <script src="js/config.js"></script>
    <script src="js/cognito-auth.js"></script>
    <script src="js/esri-map.js"></script>
    <script src="js/ride.js"></script>
</body>
</html>
